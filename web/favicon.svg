<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#005bb5"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1e4e8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Squircle with Apple-like curvature -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle specular top edge -->
  <path d="M 16 3 Q 32 3 48 3" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Inner Chip Chassis Shape -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#chipGrad)" filter="url(#glow)"/>

  <!-- 3x3 Key Matrix Pins inside Chip -->
  <!-- Row 1 -->
  <rect x="18" y="18" width="6" height="6" rx="1.8" fill="#111215"/>
  <rect x="29" y="18" width="6" height="6" rx="1.8" fill="#111215"/>
  <rect x="40" y="18" width="6" height="6" rx="1.8" fill="#0071e3"/>

  <!-- Row 2 -->
  <rect x="18" y="29" width="6" height="6" rx="1.8" fill="#111215"/>
  <rect x="29" y="29" width="6" height="6" rx="1.8" fill="#111215"/>
  <rect x="40" y="29" width="6" height="6" rx="1.8" fill="#111215"/>

  <!-- Row 3: Knobs / Hero Accent -->
  <circle cx="21" cy="43" r="3.2" fill="#111215"/>
  <circle cx="32" cy="43" r="3.2" fill="#111215"/>
  <circle cx="43" cy="43" r="4.2" fill="#ff3b30"/>

  <!-- Outer Microchip Pins (Top, Bottom, Left, Right) -->
  <path d="M 23 9 L 23 14 M 32 9 L 32 14 M 41 9 L 41 14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 23 50 L 23 55 M 32 50 L 32 55 M 41 50 L 41 55" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 9 23 L 14 23 M 9 32 L 14 32 M 9 41 L 14 41" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 23 L 55 23 M 50 32 L 55 32 M 50 41 L 55 41" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
